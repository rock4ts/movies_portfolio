include:
  - ./docker-compose.ch.yaml

services:

  postgres-admin:
    image: postgres:16
    environment:
      - POSTGRES_DB=theatre
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - pg_data_admin:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-auth:
    build: docker/pg-auth
    environment:
      - POSTGRES_DB=auth
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - ./docker/pg-auth/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
      - pg_data_auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=auth

  jaeger-init:
    image: busybox
    entrypoint: ["/bin/sh", "/scripts/init_jaeger_badger.sh"]
    volumes:
      - jaeger_data:/badger
      - ./scripts/init_jaeger_badger.sh:/scripts/init_jaeger_badger.sh:ro

  jaeger-tracer:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
      - QUERY_BASE_PATH=/tracer
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    volumes:
      - jaeger_data:/badger

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  admin-panel:
    build: ./admin_panel
    volumes:
      - static_value:/admin_panel/app/static/
      - ./auth-certs/jwt-public.pem:/run/secrets/jwt/jwt-public.pem:ro
    env_file:
      - env-files/.env.admin
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres-admin:
        condition: service_healthy

  admin-swagger:
    image: swaggerapi/swagger-ui
    volumes:
      - ./admin_panel/openapi.yaml:/swagger.yaml
    environment:
      - SWAGGER_JSON=/swagger.yaml
    depends_on:
      - admin-panel

  architecture-renderer:
    image: plantuml/plantuml:latest
    entrypoint: ["/bin/sh", "/scripts/render_project_schemas.sh"]
    volumes:
      - ./architecture-raw:/input:ro
      - schema_output:/output
      - ./scripts/render_project_schemas.sh:/scripts/render_project_schemas.sh:ro

  elastic-db:
    image: elasticsearch:8.6.2
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  elastic-init:
    image: curlimages/curl:latest
    depends_on:
      elastic-db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create_elastic_indexes.sh"]
    volumes:
      - ./elasticsearch/indexes:/data/indexes:ro
      - ./scripts/create_elastic_indexes.sh:/scripts/create_elastic_indexes.sh:ro
    restart: on-failure

  movies-etl:
    build: ./movies_etl
    volumes:
      - etl_state:/opt/app/data
    env_file:
      - env-files/.env.etl
    depends_on:
      postgres-admin:
        condition: service_healthy
      elastic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  movies-api:
    build: movies_api/
    env_file:
      - env-files/.env.movies
    depends_on:
      elastic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./auth-certs/jwt-public.pem:/run/secrets/jwt/jwt-public.pem:ro
    restart: unless-stopped

  auth-api:
    build: auth_api/
    env_file:
      - env-files/.env.auth
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger-tracer:
        condition: service_started
    volumes:
      - ./auth-certs:/run/secrets/jwt:ro

  kafka-1:
    image: apache/kafka:4.1.0
    environment:
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_LISTENERS=BROKER://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=BROKER://kafka-1:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=BROKER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE=false
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-2:
    image: apache/kafka:4.1.0
    environment:
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
      - KAFKA_NODE_ID=2
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_LISTENERS=BROKER://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=BROKER://kafka-2:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=BROKER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE=false
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-3:
    image: apache/kafka:4.1.0
    environment:
      - CLUSTER_ID=4L6g3nShT-eMCtK--X86sw
      - KAFKA_NODE_ID=3
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      - KAFKA_LISTENERS=BROKER://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=BROKER://kafka-3:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=BROKER
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=3
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=2
      - KAFKA_DEFAULT_REPLICATION_FACTOR=3
      - KAFKA_MIN_INSYNC_REPLICAS=2
      - KAFKA_NUM_PARTITIONS=3
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=false
      - KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE=false
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.1.0
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      TOPIC_CONFIGS: ugc-events,3,3,2,delete,604800000,3600000;ugc-anonymous-events,3,3,2,delete,259200000,3600000
    volumes:
      - ./scripts/init_kafka_ugc.sh:/scripts/init_kafka_ugc.sh:ro
    entrypoint:
      - /bin/bash
      - /scripts/init_kafka_ugc.sh

  ugc-api:
    build: ugc_api/
    env_file:
      - env-files/.env.ugc-api
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./auth-certs/jwt-public.pem:/run/secrets/jwt/jwt-public.pem:ro
    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "8081:8081"
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_value:/var/www/static/
      - schema_output:/var/www/schema-render:ro
      - ./clickhouse_profiler/results_example.tar.gz:/var/www/clickhouse-profiler-results.tar.gz:ro

    depends_on:
      admin-panel:
        condition: service_healthy
      admin-swagger:
        condition: service_started
      clickhouse-ui:
        condition: service_started
      jaeger-tracer:
        condition: service_started
      movies-api:
        condition: service_started
      auth-api:
        condition: service_started
      ugc-api:
        condition: service_started
      architecture-renderer:
        condition: service_completed_successfully
    networks:
      - default
      - clickhouse_net

volumes:
  pg_data_admin:
  pg_data_auth:
  static_value:
  es_data:
  etl_state:
  jaeger_data:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
  schema_output:
