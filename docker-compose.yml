services:

  postgres-admin:
    image: postgres:16
    environment:
      - POSTGRES_DB=theatre
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - pg_data_admin:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres-auth:
    build: docker/pg-auth
    environment:
      - POSTGRES_DB=auth
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - ./docker/pg-auth/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql
      - pg_data_auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: >
      postgres
      -c shared_preload_libraries=pg_cron
      -c cron.database_name=auth

  jaeger-init:
    image: busybox
    entrypoint: ["/bin/sh", "/scripts/init_jaeger_badger.sh"]
    volumes:
      - jaeger_data:/badger
      - ./scripts/init_jaeger_badger.sh:/scripts/init_jaeger_badger.sh:ro

  jaeger-tracer:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
      - QUERY_BASE_PATH=/tracer
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    volumes:
      - jaeger_data:/badger
      - jaeger_tmp:/tmp

  redis:
    image: redis:alpine
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  admin-panel:
    build: ./admin_panel
    volumes:
      - static_value:/admin_panel/app/static/
      - ./auth-certs/jwt-public.pem:/run/secrets/jwt/jwt-public.pem:ro
    env_file:
      - env-files/.env.admin
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres-admin:
        condition: service_healthy

  admin-swagger:
    image: swaggerapi/swagger-ui
    volumes:
      - ./admin_panel/openapi.yaml:/swagger.yaml
    environment:
      - SWAGGER_JSON=/swagger.yaml
    depends_on:
      - admin-panel

  architecture-renderer:
    image: plantuml/plantuml:latest
    entrypoint: ["/bin/sh", "/scripts/render_project_schemas.sh"]
    volumes:
      - ./architecture-raw:/input:ro
      - schema_output:/output
      - ./scripts/render_project_schemas.sh:/scripts/render_project_schemas.sh:ro

  elastic-db:
    image: elasticsearch:8.6.2
    environment:
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  elastic-init:
    image: curlimages/curl:latest
    depends_on:
      elastic-db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/create_elastic_indexes.sh"]
    volumes:
      - ./elasticsearch/indexes:/data/indexes:ro
      - ./scripts/create_elastic_indexes.sh:/scripts/create_elastic_indexes.sh:ro
    restart: on-failure

  movies-etl:
    build: ./movies_etl
    volumes:
      - etl_state:/opt/app/data
    env_file:
      - env-files/.env.etl
    depends_on:
      postgres-admin:
        condition: service_healthy
      elastic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  movies-api:
    build: movies_api/
    env_file:
      - env-files/.env.movies
    depends_on:
      elastic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - ./auth-certs/jwt-public.pem:/run/secrets/jwt/jwt-public.pem:ro
    restart: unless-stopped

  auth-api:
    build: auth_api/
    env_file:
      - env-files/.env.auth
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger-tracer:
        condition: service_started
    volumes:
      - ./auth-certs:/run/secrets/jwt:ro

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - static_value:/var/www/static/
      - schema_output:/var/www/schema-render:ro
      - ./ugc_etl_profiler/results_example.tar.gz:/var/www/ugc-profiler-results.tar.gz:ro

    depends_on:
      admin-panel:
        condition: service_healthy
      admin-swagger:
        condition: service_started
      jaeger-tracer:
        condition: service_started
      architecture-renderer:
        condition: service_completed_successfully

volumes:
  pg_data_admin:
  pg_data_auth:
  static_value:
  es_data:
  etl_state:
  jaeger_data:
  jaeger_tmp:
  schema_output:
