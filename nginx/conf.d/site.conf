server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    server_tokens off;
    
    root /data;

    location ~* \.(?:jpg|jpeg|gif|png|ico|css|js)$ {
        log_not_found off;
        expires 90d;
    }

    location ^~ /admin/docs/ {
        proxy_pass http://admin-swagger:8080/;
    }

    location ^~ /admin/api/ {
        proxy_pass http://admin-panel:8000/api/;
    }

    location /admin/ {
        proxy_pass http://admin-panel:8000;
    }

    location ^~ /static/ {
        alias /var/www/static/;
    }

    location /movies/api/ {
        limit_req zone=one burst=5;
        proxy_pass http://movies-api:8000/;
    }

    location /auth/api/ {
        proxy_pass http://auth-api:8000/;
    }

    location ^~ /ugc/api/docs/ {
        proxy_pass http://ugc-api:8000/openapi/;
    }

    location /ugc/api/ {
        limit_req zone=two burst=5;
        proxy_pass http://ugc-api:8000/api/;
    }

    location ^~ /tracer/ {
        proxy_pass http://jaeger-tracer:16686/tracer/;
    }

    location = /logs {
        return 301 /logs/;
    }

    location ^~ /logs/ {
        proxy_pass http://kibana:5601;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location = /architecture {
        return 301 /architecture/;
    }

    location /architecture/ {
        alias /var/www/schema-render/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    location = /ch-profiler/results {
        alias /var/www/clickhouse-profiler-results.tar.gz;
        types { }
        default_type application/gzip;
        add_header Content-Disposition 'attachment; filename="results_example.tar.gz"' always;
    }

    location = /ch-ui {
        return 301 /ch-ui/;
    }

    # CH-UI official image is built with base=/; strip /ch-ui, rewrite asset
    # URLs, and inject VITE_BASE_PATH so the SPA talks under this prefix.
    location ^~ /ch-ui/ {
        proxy_pass http://clickhouse-ui:3488/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;

        proxy_set_header Accept-Encoding "";
        sub_filter_types text/javascript application/javascript text/css;
        sub_filter_once off;
        sub_filter '"/assets/' '"/ch-ui/assets/';
        sub_filter "'/assets/" "'/ch-ui/assets/";
        sub_filter '`/assets/' '`/ch-ui/assets/';
        sub_filter '(/assets/' '(/ch-ui/assets/';
        sub_filter '</head>' '<script>window.env={VITE_BASE_PATH:"/ch-ui"}</script></head>';
    }
}
