server {
    listen       80 default_server;
    listen       [::]:80 default_server;
    server_name  _;
    server_tokens off;

    root /data;


    location ~* \.(?:jpg|jpeg|gif|png|ico|css|js)$ {
        log_not_found off;
        expires 90d;
    }

    location /admin {
        proxy_pass http://admin-panel:8000;
    }

    location ^~ /static/ {
        alias /var/www/static/;
    }

    location /auth {
        proxy_pass http://auth-app:8000;
    }

    location /api {
        proxy_pass http://content-app:8000;
    }

    error_page  404              /404.html;

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   html;
    }
}