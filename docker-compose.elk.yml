services:

  elastic-db-elk:
    image: elasticsearch:8.10.2
    volumes:
      - elastic-data-elk:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    networks:
      - elk_net

  logstash:
    image: logstash:8.10.2
    volumes:
      - ./elk/logstash.conf:/config/logstash.conf:ro
    ports:
      - "5045:5045"
    environment:
      XPACK_MONITORING_ENABLED: false
      ES_HOST: http://elastic-db-elk:9200
    depends_on:
      elastic-db-elk:
        condition: service_healthy
    command: logstash -f /config/logstash.conf
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9600/_node/pipelines || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - elk_net

  kibana:
    image: kibana:8.10.2
    environment:
      ELASTICSEARCH_HOSTS: http://elastic-db-elk:9200
      SERVER_BASEPATH: /logs
      SERVER_REWRITEBASEPATH: true
      SERVER_PUBLICBASEURL: http://localhost/logs
    depends_on:
      elastic-db-elk:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - elk_net

  filebeat:
    image: elastic/filebeat:8.10.2
    volumes:
      - ./elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - auth_api_logs:/var/log/auth-api:ro
      - movies_api_logs:/var/log/movies-api:ro
      - filebeat_data:/usr/share/filebeat/data
    depends_on:
      logstash:
        condition: service_healthy
    command: ["filebeat", "-e", "--strict.perms=false"]
    restart: unless-stopped
    networks:
      - elk_net

volumes:
  elastic-data-elk:
  auth_api_logs:
  movies_api_logs:
  filebeat_data:

networks:
  elk_net:
    driver: bridge
