name: movies-dev-ch

services:
  keeper-1:
    image: clickhouse/clickhouse-keeper:23
    hostname: keeper-1
    restart: unless-stopped
    volumes:
      - ./clickhouse/dev/keeper/keeper1.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper_1_data:/var/lib/clickhouse-keeper
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-keeper-client -h 127.0.0.1 -p 9181 -q ruok | grep -q imok"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - clickhouse_net

  clickhouse-node1:
    image: clickhouse/clickhouse-server:23
    hostname: clickhouse-node1
    restart: unless-stopped
    env_file:
      - ./env-files/.env.clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./clickhouse/dev/data/node1:/etc/clickhouse-server
      - clickhouse_node1_data:/var/lib/clickhouse
    depends_on:
      keeper-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --host 127.0.0.1 --database default --user admin --password \"$$CLICKHOUSE_ADMIN_PASSWORD\" --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - clickhouse_net

  clickhouse-node2:
    image: clickhouse/clickhouse-server:23
    hostname: clickhouse-node2
    restart: unless-stopped
    env_file:
      - ./env-files/.env.clickhouse
    ports:
      - "8124:8123"
      - "9001:9000"
    volumes:
      - ./clickhouse/dev/data/node2:/etc/clickhouse-server
      - clickhouse_node2_data:/var/lib/clickhouse
    depends_on:
      keeper-1:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --host 127.0.0.1 --database default --user admin --password \"$$CLICKHOUSE_ADMIN_PASSWORD\" --query 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - clickhouse_net

  clickhouse-ui:
    image: ghcr.io/caioricciuti/ch-ui:latest
    restart: unless-stopped
    ports:
      - "3488:3488"
    environment:
      CLICKHOUSE_URL: http://clickhouse-node1:8123
    volumes:
      - clickhouse_ui_data:/app/data
    depends_on:
      clickhouse-node1:
        condition: service_healthy
    networks:
      - clickhouse_net

  clickhouse-init:
    image: clickhouse/clickhouse-server:23
    env_file:
      - ./env-files/.env.clickhouse
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        clickhouse-client --host clickhouse-node1 --database default
        --user admin --password "$$CLICKHOUSE_ADMIN_PASSWORD"
        --multiquery < /init/01_create_database.sql
        &&
        clickhouse-client --host clickhouse-node1 --database default
        --user admin --password "$$CLICKHOUSE_ADMIN_PASSWORD"
        --multiquery < /init/02_create_raw_event_table.sql
        &&
        clickhouse-client --host clickhouse-node1 --database default
        --user admin --password "$$CLICKHOUSE_ADMIN_PASSWORD"
        --multiquery < /init/03_create_destination_event_tables.sql
        &&
        clickhouse-client --host clickhouse-node1 --database default
        --user admin --password "$$CLICKHOUSE_ADMIN_PASSWORD"
        --multiquery < /init/04_create_event_materialized_views.sql
    volumes:
      - ./clickhouse/init:/init:ro
    depends_on:
      clickhouse-node1:
        condition: service_healthy
      clickhouse-node2:
        condition: service_healthy
    restart: "no"
    networks:
      - clickhouse_net

networks:
  clickhouse_net:
    driver: bridge

volumes:
  keeper_1_data:
  clickhouse_node1_data:
  clickhouse_node2_data:
  clickhouse_ui_data:
