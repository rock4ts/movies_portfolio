<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Architecture Description</title>
    <style>
        :root {
            color-scheme: light;
            --text: #1a1a1a;
            --muted: #555;
            --border: #ddd;
            --code-bg: #f4f4f4;
        }
        body {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text);
            background: #fafafa;
        }
        main {
            max-width: 46rem;
            margin: 0 auto;
            padding: 1.5rem 1.25rem 3rem;
        }
        nav {
            margin-bottom: 1.5rem;
            font-family: system-ui, sans-serif;
            font-size: 0.9rem;
        }
        nav a { color: var(--muted); }
        #content :is(h1, h2, h3, h4) {
            line-height: 1.25;
            margin-top: 1.6em;
            margin-bottom: 0.5em;
        }
        #content h1 { margin-top: 0; }
        #content p, #content ul, #content ol { margin: 0.75em 0; }
        #content code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.9em;
            background: var(--code-bg);
            padding: 0.1em 0.35em;
            border-radius: 3px;
        }
        #content pre {
            overflow-x: auto;
            background: var(--code-bg);
            padding: 0.9rem 1rem;
            border-radius: 4px;
            border: 1px solid var(--border);
        }
        #content pre code {
            padding: 0;
            background: none;
        }
        #content a { color: #0b57d0; }
        #content hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 2rem 0;
        }
        #status {
            font-family: system-ui, sans-serif;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <nav><a href="./">← Back</a></nav>
        <div id="status">Loading description…</div>
        <article id="content" hidden></article>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script>
        const statusEl = document.getElementById("status");
        const contentEl = document.getElementById("content");
        const stage = location.pathname.replace(/\/+$/, "").split("/").pop() || "Architecture";
        document.title = stage + " — Description";

        fetch("README.md")
            .then((response) => {
                if (!response.ok) {
                    throw new Error("Could not load README.md (" + response.status + ")");
                }
                return response.text();
            })
            .then((markdown) => {
                contentEl.innerHTML = marked.parse(markdown);
                statusEl.hidden = true;
                contentEl.hidden = false;
            })
            .catch((error) => {
                statusEl.textContent = error.message;
            });
    </script>
</body>
</html>
